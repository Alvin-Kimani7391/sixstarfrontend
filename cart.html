<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Six Star Suppliers</title>
<meta name="description" content="Review your cart, choose product options, and proceed to checkout with Six Star Suppliers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/e1426ab85b.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   CART PAGE — Six Star Suppliers
   Every line is re-fetched fresh from the backend on load (same
   pattern as checkout.html's enrichLine), so price/stock/MOQ/tier
   pricing/variant options shown here are always accurate, never
   trusted blindly from localStorage. Buyers can change quantity,
   pick/change Size/Color-style variant options, and remove lines
   before moving on to checkout, which re-validates everything again.
   ============================================================ */

.cart-wrap {
  max-width: 980px; margin: 0 auto; padding: 8px 16px 40px;
  display: grid; grid-template-columns: 1fr 320px; gap: 22px; align-items: start;
}
@media(max-width: 860px) { .cart-wrap { grid-template-columns: 1fr; } }
.cart-main { min-width: 0; }

.back-shopping {
  display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 14px;
  padding: 9px 14px; border-radius: var(--radius-sm);
  background: rgba(242,169,59,0.08); border: 1px solid rgba(242,169,59,0.2);
  color: var(--marigold-deep); font-weight: 700; font-size: 13.5px; transition: 0.2s ease;
}
.back-shopping:hover { transform: translateX(-3px); background: rgba(242,169,59,0.15); }

.section-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-soft);
  padding: 20px; margin-bottom: 16px;
}
.section-card h3 {
  font-size: 15px; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.section-card h3 .h-icon {
  width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  background: rgba(242,169,59,.12); color: var(--marigold-deep); font-size: 13px; flex-shrink: 0;
}
.section-card h3 .h-count {
  margin-left: auto; font-size: 11px; font-weight: 800; color: var(--ink-faint);
  background: var(--bg-page); border: 1px solid var(--line); padding: 2px 9px; border-radius: 20px;
}

.cart-item-wrapper { margin-bottom: 12px; }
.cart-item-wrapper:last-child { margin-bottom: 0; }
.premium-cart {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  padding: 15px; background: var(--white); border-radius: var(--radius-md);
  border: 1px solid var(--line); transition: border .2s ease, box-shadow .2s ease;
}
.premium-cart:hover { box-shadow: 0 4px 14px rgba(20,20,20,.05); }
.premium-cart.line-stale { border-color: rgba(184,68,46,.4); background: rgba(184,68,46,.02); }
.cart-left { display: flex; gap: 13px; flex: 1; min-width: 0; }
.cart-left img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); flex-shrink: 0; background: var(--bg-page); cursor: pointer; }
.cart-details { flex: 1; min-width: 0; }
.cart-details h4 { font-size: 13.5px; font-weight: 700; color: var(--ink); margin: 0 0 4px; line-height: 1.4; cursor: pointer; }
.price-line { margin: 2px 0 10px; color: var(--price); font-family: var(--font-mono); font-weight: 800; font-size: 14px; }
.price-line small { color: var(--ink-faint); font-weight: 600; font-size: 11px; margin-left: 6px; }
.mini-config { margin-top: 8px; }
.mini-label { font-size: 10px; color: var(--ink-faint); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800; }

.wholesale-badge {
  display: inline-block; background: var(--pop); color: #fff; font-size: 9px; font-weight: 800;
  padding: 2px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; vertical-align: 2px;
}
.standard-delivery-badge {
  display: inline-block; background: rgba(37,99,235,0.12); color: #2563eb; font-size: 9px; font-weight: 800;
  padding: 2px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; vertical-align: 2px;
}
.own-delivery-badge {
  display: inline-block; background: rgba(124,58,237,0.14); color: var(--pop); font-size: 9px; font-weight: 800;
  padding: 2px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; vertical-align: 2px;
}
.wholesale-info { background: #F5F0FF; border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; border-left: 3px solid var(--pop); }
.wholesale-info .info-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-soft); padding: 2px 0; }
.wholesale-info .info-row strong { color: var(--ink); }
.wholesale-info .info-row .highlight { color: var(--pop); font-weight: 700; text-align: right; }
.wholesale-tiers { margin-top: 6px; font-size: 11px; color: var(--ink-soft); }
.wholesale-tiers span { display: inline-block; background: rgba(124, 58, 237, 0.1); padding: 2px 8px; border-radius: 4px; margin: 2px 4px 2px 0; color: var(--pop); font-weight: 600; }
.wholesale-tiers span.tier-active { background: var(--pop); color: #fff; }
.moq-warning { font-size: 11px; color: var(--brick); margin-top: 4px; font-weight: 600; }
.stock-warning { font-size: 11px; color: var(--brick); margin-top: 4px; font-weight: 700; }
.standard-delivery-note {
  font-size: 11px; color: #2563eb; margin-top: 8px; font-weight: 600;
  background: rgba(37,99,235,0.06); padding: 8px 10px; border-radius: 8px; border-left: 3px solid #2563eb;
  display: flex; align-items: flex-start; gap: 6px; line-height: 1.5;
}
.heavy-delivery-note {
  font-size: 11px; color: var(--pop); margin-top: 8px; font-weight: 600;
  background: rgba(124,58,237,0.06); padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--pop);
  display: flex; align-items: flex-start; gap: 6px; line-height: 1.5;
}
/* Flash Sale line note — mirrors checkout.html's flash-sale-note so a Flash
   Sale line reads consistently across cart and checkout. */
.flash-sale-note {
  font-size: 11px; color: #e0511a; margin-top: 8px; font-weight: 600;
  background: rgba(224,81,26,.06); padding: 8px 10px; border-radius: 8px; border-left: 3px solid #e0511a;
  display: flex; align-items: flex-start; gap: 6px; line-height: 1.5;
}

/* ---- Dynamic attribute/variant picker ---- */
.attr-group { margin-bottom: 10px; }
.attr-options { display: flex; flex-wrap: wrap; gap: 8px; }
.attr-btn {
  min-width: 40px; padding: 7px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg-page); color: var(--ink);
  cursor: pointer; font-weight: 700; font-size: 11.5px; transition: .2s ease;
}
.attr-btn:hover:not(:disabled) { border-color: var(--marigold); transform: translateY(-1px); }
.attr-btn.active { background: linear-gradient(135deg, var(--marigold), var(--marigold-deep)); color: var(--navy-deep); border-color: transparent; box-shadow: 0 6px 16px rgba(242,169,59,.25); }
.attr-btn:disabled { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }
.variant-needed-note { font-size: 11.5px; color: var(--brick); font-weight: 700; margin-top: 6px; }

.cart-actions { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; flex-shrink: 0; }
.qty-controls { display: flex; align-items: center; gap: 8px; background: var(--bg-page); border: 1.5px solid var(--line); border-radius: 20px; padding: 4px 7px; }
.qty-controls button { width: 24px; height: 24px; border: none; border-radius: 50%; background: linear-gradient(135deg, var(--marigold), var(--marigold-deep)); color: var(--navy-deep); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qty-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
.qty-controls span { font-weight: 700; font-size: 13px; min-width: 14px; text-align: center; }
.removebtn { background: rgba(184,68,46,.1); color: var(--brick); border: 1px solid rgba(184,68,46,.25); padding: 6px 9px; border-radius: 8px; cursor: pointer; transition: .2s ease; }
.removebtn:hover { background: var(--brick); color: #fff; }

.summary-sidebar { position: sticky; top: 78px; }
.summary { padding: 18px; border-radius: var(--radius-lg); background: linear-gradient(135deg,rgba(242,169,59,.05),rgba(242,169,59,.05)); border: 1px solid rgba(242,169,59,.15); }
.summary p { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0; display: flex; justify-content: space-between; gap: 10px; }
.summary p span:last-child { text-align: right; }
.summary small.row-hint { display: block; font-size: 10.5px; color: var(--ink-faint); font-weight: 500; margin-top: 4px; line-height: 1.5; }
.summary hr { border: none; border-top: 1px dashed var(--line); margin: 10px 0; }
.summary h3 { font-size: 18px; color: var(--ink); margin-top: 10px; display: flex; justify-content: space-between; }
.summary h3 span { font-family: var(--font-mono); color: var(--marigold); }

button.main { width: 100%; padding: 15px; margin-top: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--marigold), var(--marigold-deep)); color: var(--navy-deep); font-weight: 800; font-size: 14.5px; cursor: pointer; box-shadow: 0 10px 24px rgba(242,169,59,.28); transition: .2s ease; }
button.main:hover:not(:disabled) { transform: translateY(-2px); }
button.main i { margin-right: 8px; }
button.main:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.empty-cart-msg { text-align: center; padding: 40px 10px; color: var(--ink-soft); font-size: 14px; }
.empty-cart-msg i { display: block; font-size: 30px; margin-bottom: 10px; color: var(--line); }
.empty-cart-msg a { display: inline-block; margin-top: 14px; padding: 10px 20px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--marigold), var(--marigold-deep)); color: var(--navy-deep); font-weight: 800; font-size: 13px; }

.section-loading { text-align: center; padding: 30px; color: var(--ink-soft); font-size: 13.5px; }
.section-loading i { display: block; font-size: 20px; margin-bottom: 8px; color: var(--marigold); }

.page-error-banner {
  display: none; max-width: 980px; margin: 14px auto 0; padding: 12px 16px;
  border-radius: var(--radius-sm); background: rgba(184,68,46,.08);
  border: 1px solid rgba(184,68,46,.25); color: var(--brick); font-size: 13px;
  font-weight: 600; text-align: center;
}

@media (max-width: 600px) {
  .cart-wrap { padding: 8px 12px 32px; }
  .section-card { padding: 16px; }
  .premium-cart { flex-direction: column; }
  .cart-actions { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
  .cart-left { width: 100%; }
}
</style>
</head>
<body data-page="cart.html">

<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header" id="site-header"></header>

<main>
  <div class="page-error-banner" id="pageErrorBanner"></div>

  <div class="cart-wrap">
    <div class="cart-main">
      <a href="product.html" class="back-shopping"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>

      <div class="section-card">
        <h3><span class="h-icon"><i class="fa-solid fa-bag-shopping"></i></span> Your Cart <span class="h-count" id="itemCount">0</span></h3>
        <div id="cart-items"><div class="section-loading"><i class="fa-solid fa-spinner fa-spin"></i>Loading your cart…</div></div>
      </div>
    </div>

    <div class="summary-sidebar">
      <div class="section-card">
        <h3><span class="h-icon"><i class="fa-solid fa-receipt"></i></span> Order Summary</h3>
        <div class="summary">
          <p>Items Total <span>Ksh <span id="item-price">0</span></span></p>
          <small class="row-hint">Delivery/transport fees are calculated on the next step, based on your delivery location.</small>
          <hr>
          <h3>Subtotal <span>Ksh <span id="total-price">0</span></span></h3>
        </div>
        <button class="main" id="checkoutBtn" onclick="goToCheckout()"><i class="fa-solid fa-arrow-right"></i> Proceed to Checkout</button>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<a href="#" class="wa-float" id="wa-float"></a>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
/* ============================================================
   CART PAGE LOGIC — mirrors checkout.html's enrichment approach
   (fresh product + variant + category-attribute fetch per line)
   so what a buyer sees/edits here matches exactly what checkout
   validates a moment later. No pricing/stock/MOQ decision is ever
   trusted from localStorage — only lineId/qty/variantId are.
   ============================================================ */
let enriched = [];

function showPageError(message) {
  const banner = document.getElementById("pageErrorBanner");
  if (!banner) return;
  banner.textContent = message;
  banner.style.display = "block";
}

function isWholesaleLine(e) { return e.isWholesale; }
function isHeavyWholesale(e) { return e.isWholesale && e.deliveryType === "heavy"; }

async function enrichLine(line) {
  // ============================================================
  // FLASH SALE LINE — re-fetch the FlashSale doc itself (price/stock live
  // there), not the product. Falls into the same `enriched` shape the
  // renderer already expects, with isFlashDeal:true carrying the extra
  // fields the UI needs for its badge/urgency copy.
  // ============================================================
  if (line.isFlashDeal && line.flashSaleId) {
    let fs;
    try {
      const res = await SS_API.getFlashSale(line.flashSaleId);
      fs = res.flashSale || res;
    } catch (e) {
      return { line, product: null, error: "This Flash Sale is no longer available.", isFlashDeal: true };
    }

    if (!fs.isLive) {
      return { line, product: fs.product || null, error: "This Flash Sale has ended or sold out.", isFlashDeal: true };
    }

    const remaining = fs.remainingStock != null
      ? fs.remainingStock
      : Math.max(0, (fs.stockAllocated || 0) - (fs.stockSold || 0));

    const qty = Math.min(Math.max(1, Number(line.qty) || 1), Math.max(remaining, 1));

    return {
      line,
      product: fs.product || { name: line.name, images: line.image ? [line.image] : [] },
      variantDefs: [], variants: [], requiresVariant: false,
      selectedVariant: null, selectedAttrs: {},
      isWholesale: false, deliveryType: "simple", minQty: 1, qty,
      unitPrice: fs.flashSalePrice,
      stockAvailable: remaining,
      error: null,
      isFlashDeal: true,
      flashSaleId: fs.id || fs._id,
      flashSaleMeta: { discountPercent: fs.discountPercent, originalPrice: fs.originalPrice, endAt: fs.endAt },
    };
  }

  let product, variantDefs = [];
  try {
    const res = await SS_API.getProduct(line.productId);
    product = res.product || res;
  } catch (e) {
    return { line, product: null, error: "This product is no longer available." };
  }

  try {
    const catId = product.category?._id || product.category;
    const attrRes = await SS_API.getCategoryAttributes(catId);
    variantDefs = (attrRes.attributes || []).filter((a) => a.isVariantAttribute);
  } catch (e) { variantDefs = []; }

  const variants = Array.isArray(product.variants) ? product.variants : [];
  const requiresVariant = variantDefs.length > 0;

  let selectedVariant = null;
  if (line.variantId) selectedVariant = variants.find((v) => v._id === line.variantId) || null;

  const selectedAttrs = {};
  if (selectedVariant) {
    selectedVariant.combination.forEach((c) => { selectedAttrs[c.attribute] = c.value; });
  }

  const isWholesale = product.sellerRole === "wholesaler";
  const minQty = isWholesale ? Math.max(1, Number(product.minOrderQuantity) || 1) : 1;
  const qty = Math.max(minQty, Number(line.qty) || minQty);

  const basePrice = product.displayPrice ?? product.finalPrice ?? 0;
  const tierPrice = SS_CART.resolveUnitPrice(basePrice, product.pricingTiers || [], qty);
  const unitPrice = tierPrice + (selectedVariant?.priceAdjustment || 0);

  const stockAvailable = requiresVariant ? (selectedVariant ? selectedVariant.stock : null) : product.stock;
  const deliveryType = product.deliveryType || "heavy";

  return {
    line, product, variantDefs, variants, requiresVariant,
    selectedVariant, selectedAttrs, isWholesale, deliveryType, minQty, qty,
    unitPrice, stockAvailable, error: null,
    isFlashDeal: false,
  };
}

async function loadCart() {
  const container = document.getElementById("cart-items");
  const rawLines = SS_CART.getAll();

  if (rawLines.length === 0) {
    container.innerHTML = `<p class="empty-cart-msg"><i class="fa-solid fa-cart-shopping"></i>Your cart is empty<br><a href="product.html">Browse products</a></p>`;
    enriched = [];
    updateSummary();
    return;
  }

  container.innerHTML = `<div class="section-loading"><i class="fa-solid fa-spinner fa-spin"></i>Fetching live prices &amp; stock…</div>`;
  enriched = await Promise.all(rawLines.map(enrichLine));
  renderCartItems();
  updateSummary();
}

function renderCartItems() {
  const container = document.getElementById("cart-items");
  container.innerHTML = "";
  document.getElementById("itemCount").textContent = enriched.length;

  enriched.forEach((e, i) => {
    if (e.error) {
      container.innerHTML += `
        <div class="cart-item-wrapper">
          <div class="premium-cart line-stale">
            <div class="cart-details"><h4>${e.line.name || "Unavailable item"} ${e.isFlashDeal ? '<span class="wholesale-badge" style="background:linear-gradient(135deg,#FF5A1F,#FF8A00);"><i class="fa-solid fa-bolt"></i> Flash Sale</span>' : ""}</h4>
              <div class="stock-warning"><i class="fa-solid fa-triangle-exclamation"></i> ${e.error}</div>
            </div>
            <button class="removebtn" onclick="removeLine(${i})"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`;
      return;
    }

    const { product, requiresVariant, variantDefs, variants, selectedVariant, selectedAttrs, isWholesale, minQty, qty, unitPrice, stockAvailable, isFlashDeal } = e;
    const heavy = isHeavyWholesale(e);
    const flashBadge = isFlashDeal
      ? `<span class="wholesale-badge" style="background:linear-gradient(135deg,#FF5A1F,#FF8A00);"><i class="fa-solid fa-bolt"></i> Flash Sale</span>`
      : "";
    const productLinkId = product._id || product.id || "";
    const img = Array.isArray(product.images) && product.images.length ? product.images[0] : "";
    const itemTotal = unitPrice * qty;
    const canDecrease = qty > minQty;
    const outOfStock = stockAvailable != null && stockAvailable <= 0;
    const overStock = stockAvailable != null && qty >= stockAvailable;

    let wholesaleInfo = "";
    if (isWholesale) {
      let tiersHtml = "";
      if (product.pricingTiers && product.pricingTiers.length > 0) {
        const sorted = [...product.pricingTiers].sort((a, b) => a.minQty - b.minQty);
        tiersHtml = sorted.map((t) => {
          const active = qty >= t.minQty && (sorted.filter(x => qty >= x.minQty).slice(-1)[0]?.minQty === t.minQty);
          return `<span class="${active ? 'tier-active' : ''}">${t.minQty}+ = Ksh ${t.price.toLocaleString()}</span>`;
        }).join("");
      }

      const deliveryRows = heavy ? `
          ${product.freeDelivery ? `
            <div class="info-row"><span>Delivery</span><span class="highlight"><i class="fa-solid fa-check-circle"></i> Free Delivery</span></div>
          ` : product.deliveryCharge && product.deliveryCharge.chargeType === "fixed" && product.deliveryCharge.amount > 0 ? `
            <div class="info-row"><span>Delivery Charge</span><span class="highlight">Ksh ${product.deliveryCharge.amount.toLocaleString()}</span></div>
          ` : product.deliveryCharge && product.deliveryCharge.chargeType === "quantity_based" ? `
            <div class="info-row"><span>Delivery Charge</span><span class="highlight">Ksh ${product.deliveryCharge.perUnitAmount.toLocaleString()} × ${qty} unit(s)</span></div>
          ` : product.deliveryCharge && product.deliveryCharge.chargeType === "negotiated" && !product.freeDelivery ? `
            <div class="info-row" style="font-size:11px;"><span>Delivery Terms</span><span>${product.deliveryCharge.notes || "To be agreed with seller"}</span></div>
          ` : ""}
        ` : "";

      wholesaleInfo = `
        <div class="wholesale-info">
          <div class="info-row"><span>Minimum Order</span><span><strong>${minQty} units</strong></span></div>
          ${product.pricingTiers && product.pricingTiers.length > 0 ? `<div class="wholesale-tiers"><span style="font-weight:600;">Bulk Pricing:</span> ${tiersHtml}</div>` : ""}
          ${deliveryRows}
        </div>
        ${!heavy
          ? `<div class="standard-delivery-note"><i class="fa-solid fa-truck-fast"></i><span>This item ships via standard regional delivery — the Transport fee is calculated at checkout.</span></div>`
          : `<div class="heavy-delivery-note"><i class="fa-solid fa-location-dot"></i><span>This item is billed at the wholesale delivery fee shown, arranged with your Region/Town at checkout.</span></div>`}`;
    }

    // Flash Sale note — always simple/standard delivery, fixed per-unit price
    // regardless of quantity, no MOQ, no tiers, no variants.
    let flashSaleInfo = "";
    if (isFlashDeal) {
      flashSaleInfo = `
        <div class="flash-sale-note">
          <i class="fa-solid fa-bolt-lightning"></i>
          <span>Flash Sale price — locked in at Ksh ${unitPrice.toLocaleString()}/unit, regardless of quantity. ${stockAvailable} unit(s) left. Ships via standard regional delivery.</span>
        </div>`;
    }

    let variantPicker = "";
    if (requiresVariant && !isFlashDeal) {
      variantPicker = `<div class="mini-config">` + variantDefs.map((def) => {
        const values = [...new Set(variants.flatMap((v) => v.combination.filter((c) => c.attribute === def._id).map((c) => c.value)))];
        const currentVal = selectedAttrs[def._id];
        return `
          <div class="attr-group">
            <div class="mini-label">${def.name}</div>
            <div class="attr-options">
              ${values.map((val) => {
                const wouldMatch = variants.some((v) => {
                  const combo = { ...selectedAttrs, [def._id]: val };
                  return v.combination.every((c) => combo[c.attribute] === undefined || combo[c.attribute] === c.value) && v.stock > 0;
                });
                return `<button type="button" class="attr-btn ${currentVal === val ? "active" : ""}" ${!wouldMatch ? "disabled" : ""} onclick="selectAttr(${i}, '${def._id}', '${val.replace(/'/g, "\\'")}')">${val}</button>`;
              }).join("")}
            </div>
          </div>`;
      }).join("") + (!selectedVariant ? `<div class="variant-needed-note"><i class="fa-solid fa-circle-exclamation"></i> Select ${variantDefs.map(d => d.name).join(" & ")} to continue</div>` : "") + `</div>`;
    }

    container.innerHTML += `
      <div class="cart-item-wrapper">
        <div class="premium-cart ${((!requiresVariant || selectedVariant) && !outOfStock) || isFlashDeal ? "" : "line-stale"}">
          <div class="cart-left">
            <img src="${img}" onerror="this.src='images/placeholder.png'" onclick="location.href='product-detail.html?id=${productLinkId}'">
            <div class="cart-details">
              <h4 onclick="location.href='product-detail.html?id=${productLinkId}'">${product.name} ${flashBadge} ${isWholesale ? '<span class="wholesale-badge">Wholesale</span>' : ""} ${isWholesale && !heavy ? '<span class="standard-delivery-badge">Standard Delivery</span>' : ""} ${heavy ? '<span class="own-delivery-badge">Seller Delivery</span>' : ""}</h4>
              <div class="price-line">Ksh ${itemTotal.toLocaleString()} <small>(Ksh ${unitPrice.toLocaleString()} × ${qty})</small></div>
              ${flashSaleInfo}
              ${wholesaleInfo}
              ${variantPicker}
              ${isWholesale && qty === minQty && !isFlashDeal ? `<div class="moq-warning"><i class="fa-solid fa-info-circle"></i> Minimum order quantity: ${minQty} units</div>` : ""}
              ${outOfStock ? `<div class="stock-warning"><i class="fa-solid fa-triangle-exclamation"></i> ${isFlashDeal ? "Sold out" : "Out of stock"}</div>` : ""}
            </div>
          </div>
          <div class="cart-actions">
            <div class="qty-controls">
              <button onclick="decreaseQty(${i})" ${!canDecrease ? "disabled" : ""}>-</button>
              <span>${qty}</span>
              <button onclick="increaseQty(${i})" ${overStock ? "disabled" : ""}>+</button>
            </div>
            <button class="removebtn" onclick="removeLine(${i})"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      </div>`;
  });
}

function selectAttr(i, attrId, value) {
  const e = enriched[i];
  e.selectedAttrs = { ...e.selectedAttrs, [attrId]: value };
  const match = e.variants.find((v) =>
    v.combination.length === Object.keys(e.selectedAttrs).length &&
    v.combination.every((c) => e.selectedAttrs[c.attribute] === c.value)
  );
  e.selectedVariant = match || null;
  if (match) {
    SS_CART.setVariant(e.line.lineId, match._id);
    e.stockAvailable = match.stock;
    e.qty = Math.min(e.qty, Math.max(e.minQty, match.stock));
    SS_CART.setQty(e.line.lineId, e.qty);
    e.unitPrice = SS_CART.resolveUnitPrice(e.product.displayPrice ?? e.product.finalPrice ?? 0, e.product.pricingTiers || [], e.qty) + (match.priceAdjustment || 0);
  }
  renderCartItems();
  updateSummary();
}

function increaseQty(i) {
  const e = enriched[i];
  if (e.stockAvailable != null && e.qty >= e.stockAvailable) return;
  e.qty++;
  applyQtyChange(e);
}
function decreaseQty(i) {
  const e = enriched[i];
  if (e.qty <= e.minQty) return;
  e.qty--;
  applyQtyChange(e);
}
function applyQtyChange(e) {
  SS_CART.setQty(e.line.lineId, e.qty);

  // FIX: this used to unconditionally recompute unitPrice from
  // e.product.displayPrice/finalPrice + product.pricingTiers for EVERY line,
  // including Flash Sale ones. For a Flash Sale line, e.product is the
  // SELLER'S REGULAR product record (populated on the FlashSale doc) — its
  // displayPrice/finalPrice is the normal price, not flashSalePrice, and it
  // carries no pricingTiers of its own. So tapping +/- on a Flash Sale item
  // silently replaced the discounted Flash Sale price with the regular price.
  // Flash Sale pricing is a single fixed per-unit rate that never changes
  // with quantity, so just skip the recompute entirely for these lines.
  if (e.isFlashDeal) {
    renderCartItems();
    updateSummary();
    return;
  }

  const base = e.product.displayPrice ?? e.product.finalPrice ?? 0;
  e.unitPrice = SS_CART.resolveUnitPrice(base, e.product.pricingTiers || [], e.qty) + (e.selectedVariant?.priceAdjustment || 0);
  renderCartItems();
  updateSummary();
}

function removeLine(i) {
  SS_CART.remove(enriched[i].line.lineId);
  loadCart();
}

function updateSummary() {
  const live = enriched.filter((e) => !e.error);
  const itemsTotal = live.reduce((sum, e) => sum + e.unitPrice * e.qty, 0);
  document.getElementById("item-price").innerText = itemsTotal.toLocaleString();
  document.getElementById("total-price").innerText = itemsTotal.toLocaleString();

  const blocked = enriched.some((e) => e.error || (e.requiresVariant && !e.selectedVariant) || (e.stockAvailable != null && e.stockAvailable <= 0));
  document.getElementById("checkoutBtn").disabled = enriched.length === 0 || blocked;

  SS_CART.updateBadge();
}

function goToCheckout() {
  const missingVariant = enriched.find((e) => !e.error && e.requiresVariant && !e.selectedVariant);
  if (missingVariant) {
    alert(`Please select ${missingVariant.variantDefs.map(d => d.name).join(" & ")} for "${missingVariant.product.name}".`);
    return;
  }
  window.location.href = "checkout.html";
}

document.addEventListener("DOMContentLoaded", async () => {
  try {
    await loadCart();
  } catch (e) {
    console.error("Cart init error:", e);
    showPageError("Something went wrong loading your cart. Please refresh the page.");
  } finally {
    ssHideLoader();
  }
});
</script>
</body>
</html>
