<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Login — Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/agent.css">
</head>
<body>

<div class="agent-auth-page">
  <div class="agent-auth-shell">
    <div class="agent-brand-row">
      <img src="images/logo.jpg" alt="Six Star Suppliers">
      <div>Six Star <span style="color:var(--brand);">Agents</span></div>
    </div>

    <!-- ===== Stage 1: credentials ===== -->
    <div id="credentialsStage">
      <h1>Agent Login</h1>
      <p class="sub">Log in to your agent dashboard to track referrals, share marketing materials, and manage your commissions.</p>
      <div id="loginError" class="alert alert-error"></div>

      <form id="loginForm" class="form-grid">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div style="text-align:right;">
          <a href="#" id="forgotLink" style="font-size:12.5px; font-weight:700; color:var(--brand);">Forgot password?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="agent-auth-switch">Not an agent yet? <a href="agent-apply.html">Apply here</a></p>
    </div>

    <!-- ===== Stage: forgot password ===== -->
    <div id="forgotStage" style="display:none;">
      <h1>Reset Password</h1>
      <p class="sub">Enter the email on your agent account and we'll send you a reset link.</p>
      <div id="forgotError" class="alert alert-error"></div>
      <div id="forgotSuccess" class="alert alert-success"></div>

      <form id="forgotForm" class="form-grid">
        <div class="form-field">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" required>
        </div>
        <button type="submit" id="forgotBtn" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <p class="agent-auth-switch"><a href="#" id="backToLoginLink">Back to login</a></p>
    </div>
  </div>
</div>

<div id="toast"><i class="fa-solid fa-circle-check"></i><span></span></div>

<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/agent-auth.js"></script>
<script src="js/agent-api.js"></script>
<script src="js/agent-login.js"></script>
</body>
</html>
