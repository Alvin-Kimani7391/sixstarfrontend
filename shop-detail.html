<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/e1426ab85b.js" crossorigin="anonymous"></script>

<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body data-page="shop-detail.html">
<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header" id="site-header"></header>

<main>

  <div id="shopNotFound" class="shop-not-found" style="display:none;">
    <div class="wrap">
      <i class="fa-solid fa-store-slash"></i>
      <h2 style="font-family:var(--font-display);color:var(--ink);margin-bottom:8px;">Shop not found</h2>
      <p style="color:var(--ink-soft);margin-bottom:20px;">This shop may have been removed or suspended, or the link is incorrect.</p>
      <a href="/shop.html" class="btn btn-primary">Browse all shops</a>
    </div>
  </div>

  <div id="shopDetailContent">

    <div class="shop-hero" id="shopBanner"></div>

    <div class="shop-passport">
      <div class="shop-passport__card" id="shopPassportCard"></div>
    </div>

    <section class="shop-section">
      <div class="wrap">
        <div class="listing-toolbar" id="shopProductsToolbar">
          <div>
            <h2>Products from this shop</h2>
            <span class="count" id="shopProductsCount">Loading…</span>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <form id="shopProductSearchForm" style="display:flex;">
              <input type="text" id="shopProductSearchInput" placeholder="Search in this shop..." autocomplete="off"
                style="padding:9px 13px;border:1px solid var(--line);border-radius:20px 0 0 20px;border-right:none;font-size:13px;background:var(--paper);">
              <button type="submit" aria-label="Search"
                style="border:1px solid var(--line);border-left:none;border-radius:0 20px 20px 0;background:var(--paper-dim);padding:0 14px;cursor:pointer;color:var(--ink);">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </form>
            <select class="sort-select" id="shopProductSort" aria-label="Sort products">
              <option value="-createdAt">Newest</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </div>
        </div>

        <div class="p-grid" id="shopProductsGrid"></div>
        <div class="pagination" id="shopProductsPagination"></div>
      </div>
    </section>

    <section class="shop-section">
      <div class="wrap">
        <div class="shop-reviews">
          <div class="shop-reviews__header">
            <h2>Ratings &amp; Reviews</h2>
            <div class="shop-rating-summary" id="shopRatingSummary"></div>
          </div>
          <div id="shopReviewFormWrap"></div>
          <div class="shop-reviews__list" id="shopReviewsList">Loading…</div>
        </div>
      </div>
    </section>

    <section class="shop-section block tint">
      <div class="wrap">
        <div class="trust-row" style="justify-content:center;">
          <div><i class="fa-solid fa-shield-halved"></i> Reviewed &amp; approved by Six Star</div>
          <div><i class="fa-solid fa-truck-fast"></i> Countrywide delivery</div>
          <div><i class="fa-solid fa-money-bill-wave"></i> Pay via Paybill or on delivery</div>
          <div><i class="fa-solid fa-rotate-left"></i> Standard return policy applies</div>
        </div>
      </div>
    </section>

  </div>

</main>

<footer class="site-footer" id="site-footer"></footer>
<a href="#" class="wa-float" id="wa-float"></a>
<div id="toast"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/shop-detail.js"></script>
</body>
</html>
