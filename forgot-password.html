<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="brand">
      <div class="brand-mark">6★</div>
      <div>
        <div class="brand-name">Six Star Suppliers</div>
        <div class="brand-tag">Wholesale · Retail · Bulk</div>
      </div>
    </a>
  </div>
</header>

<main class="wrap">
  <div class="auth-shell">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email on your account and we'll send you a link to reset it.</p>

    <div id="fpError" class="alert alert-error"></div>
    <div id="fpSuccess" class="alert alert-success"></div>

    <form id="forgotForm" class="form-grid" novalidate>
      <div class="form-field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@business.com" required />
      </div>
      <button type="submit" id="fpBtn" class="btn btn-primary btn-block">Send reset link</button>
    </form>

    <p class="auth-switch"><a href="login.html">Back to log in</a></p>
  </div>
</main>

<footer class="footer-bottom">© 2026 Six Star Suppliers. All rights reserved.</footer>

<div id="toast"><i class="fa-solid fa-circle-check"></i><span></span></div>

<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  window.addEventListener("load", () => document.getElementById("pageLoader").classList.add("hide"));
</script>
<script src="js/forgot-password.js"></script>
</body>
</html>
