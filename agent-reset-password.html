<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Agent Password — Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/agent.css">
</head>
<body>

<div class="agent-auth-page">
  <div class="agent-auth-shell">
    <div class="agent-brand-row">
      <img src="images/logo.jpg" alt="Six Star Suppliers">
      <div>Six Star <span style="color:var(--brand);">Agents</span></div>
    </div>

    <div id="formStage">
      <h1>Set a New Password</h1>
      <p class="sub">Choose a new password for your agent account.</p>
      <div id="resetError" class="alert alert-error"></div>

      <form id="resetForm" class="form-grid">
        <div class="form-field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" minlength="6" required autocomplete="new-password">
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" minlength="6" required autocomplete="new-password">
        </div>
        <button type="submit" id="resetBtn" class="btn btn-primary btn-block">Update Password</button>
      </form>
    </div>

    <div id="invalidStage" style="display:none; text-align:center;">
      <i class="fa-solid fa-triangle-exclamation" style="font-size:34px; color:var(--danger); margin-bottom:14px; display:block;"></i>
      <h1>Link Invalid or Expired</h1>
      <p class="sub">This reset link is no longer valid. Request a new one below.</p>
      <a href="agent-login.html" class="btn btn-outline btn-block">Back to Login</a>
    </div>

    <div id="successStage" style="display:none; text-align:center;">
      <i class="fa-solid fa-circle-check" style="font-size:34px; color:var(--price); margin-bottom:14px; display:block;"></i>
      <h1>Password Updated</h1>
      <p class="sub">Redirecting you to your dashboard…</p>
    </div>
  </div>
</div>

<div id="toast"><i class="fa-solid fa-circle-check"></i><span></span></div>

<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/agent-auth.js"></script>
<script src="js/agent-api.js"></script>
<script src="js/agent-reset-password.js"></script>
</body>
</html>
