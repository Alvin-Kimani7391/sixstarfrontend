<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/e1426ab85b.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/product-detail.css">
</head>
<body data-page="product-detail.html">
<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap" id="pdContent">
    <div class="pd-wrap">
      <div>
        <div class="pd-gallery__main skel" style="aspect-ratio:1/1;"></div>
      </div>
      <div>
        <div class="skel" style="height:22px;width:120px;margin-bottom:14px;"></div>
        <div class="skel" style="height:34px;width:80%;margin-bottom:14px;"></div>
        <div class="skel" style="height:26px;width:140px;"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<a href="#" class="wa-float" id="wa-float"></a>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/product-detail.js"></script>
<script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId || typeof SS_API === 'undefined' || typeof SS_AUTH === 'undefined') {
      return;
    }

    const userId = SS_AUTH.getUserId();
    if (!userId) return; // user not logged in

    SS_API.trackProductView(productId).catch(() => {});
  })();
</script>
</body>
</html>
