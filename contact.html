<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   CONTACT PAGE — Dark Ink Theme override
   Local override of the shared .page-hero, matching about.html:
   dark ink gradient hero with subtle texture instead of the
   bright orange/purple/gold splash, and bordered icon chips
   for the contact items instead of bare colored icons.
   ============================================================ */
.page-hero {
  position: relative;
  background: linear-gradient(165deg, var(--ink) 0%, #23242B 60%, #1A1B20 100%);
  overflow: hidden;
}
.page-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(120deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);
  pointer-events: none;
}
.page-hero .wrap {
  position: relative;
  z-index: 1;
}
.page-hero h1 {
  color: #fff;
}
.page-hero p {
  color: #B9BAC2;
}

/* Contact info icons: bordered tint chips instead of bare icons */
.contact-info__item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.contact-info__item i {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--paper-dim);
  border: 1px solid var(--line);
  color: var(--brand-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
}
</style>
</head>
<body data-page="contact.html">
<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <h1>Talk to us</h1>
      <p>Questions about an order, a product, or becoming a supplier? We usually reply within the hour on WhatsApp.</p>
    </div>
  </section>

  <div class="wrap">
    <div class="contact-grid">
      <div class="contact-info">
        <div class="contact-info__item">
          <i class="fa-solid fa-phone"></i>
          <div><strong>Call or SMS</strong><br><span id="cPhone1"></span> &nbsp;·&nbsp; <span id="cPhone2"></span></div>
        </div>
        <div class="contact-info__item">
          <i class="fa-brands fa-whatsapp"></i>
          <div><strong>WhatsApp</strong><br><a href="#" id="cWhatsapp" target="_blank">Chat with us</a></div>
        </div>
        <div class="contact-info__item">
          <i class="fa-regular fa-envelope"></i>
          <div><strong>Email</strong><br><a href="#" id="cEmail"></a></div>
        </div>
        <div class="contact-info__item">
          <i class="fa-solid fa-clock"></i>
          <div><strong>Support hours</strong><br>Mon–Sat, 8am–7pm EAT</div>
        </div>
      </div>

      <form id="contactForm" class="form-grid summary-card" style="position:static;">
  <div class="alert alert-success" id="contactSuccess">Thanks — your message has been sent. We'll get back to you shortly.</div>
  <div class="alert alert-danger" id="contactError" style="display:none;"></div>
  <div class="form-field">
    <label for="cName">Your name</label>
    <input type="text" id="cName" required>
  </div>
  <div class="form-field">
    <label for="cEmail2">Your email</label>
    <input type="email" id="cEmail2" required>
  </div>
  <div class="form-field">
    <label for="cSubject">Subject</label>
    <input type="text" id="cSubject" placeholder="e.g. Order SS-10234">
  </div>
  <div class="form-field">
    <label for="cMessage">Message</label>
    <textarea id="cMessage" required placeholder="How can we help?"></textarea>
  </div>
  <button class="btn btn-primary btn-block" type="submit" id="contactSubmitBtn"><i class="fa-regular fa-paper-plane"></i> Send Message</button>
</form>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<a href="#" class="wa-float" id="wa-float"></a>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const c = window.SS_CONFIG;
  document.getElementById("cPhone1").textContent = c.PHONE_1;
  document.getElementById("cPhone2").textContent = c.PHONE_2;
  document.getElementById("cEmail").textContent = c.EMAIL;
  document.getElementById("cEmail").href = "mailto:" + c.EMAIL;
  document.getElementById("cWhatsapp").href = `https://wa.me/${c.WHATSAPP_NUMBER}`;

  const form = document.getElementById("contactForm");
  const successBox = document.getElementById("contactSuccess");
  const errorBox = document.getElementById("contactError");
  const submitBtn = document.getElementById("contactSubmitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    successBox.classList.remove("show");
    errorBox.style.display = "none";

    const name = document.getElementById("cName").value.trim();
    const email = document.getElementById("cEmail2").value.trim();
    const subject = document.getElementById("cSubject").value.trim();
    const message = document.getElementById("cMessage").value.trim();

    submitBtn.disabled = true;
    submitBtn.classList.add("is-loading");

    try {
      await SS_API.sendContactMessage({ name, email, subject, message });
      successBox.classList.add("show");
      form.reset();
      ssToast("Your message has been sent", "fa-circle-check");
    } catch (err) {
      errorBox.textContent = err.message || "Couldn't send your message. Please try again.";
      errorBox.style.display = "block";
      ssToast("Couldn't send your message", "fa-circle-exclamation");
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("is-loading");
    }
  });
});
</script>
</body>
</html>
