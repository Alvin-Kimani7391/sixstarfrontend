<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email — Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .verify-shell{
    max-width:460px; margin:48px auto 80px; padding:0 20px; text-align:center;
  }
  .verify-card{
    background:var(--white,#fff); border:1px solid var(--line,#e4d6bd); border-radius:20px;
    padding:38px 30px 34px; box-shadow:0 18px 50px -20px rgba(22,50,79,.18);
  }
  .verify-icon{
    width:64px; height:64px; border-radius:50%; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(242,169,59,.14); color:var(--marigold-deep,#d98c1f); font-size:1.7rem;
  }
  .verify-icon.ok{ background:rgba(15,110,86,.12); color:#0f6e56; }
  .verify-icon.err{ background:rgba(224,80,80,.1); color:#b8442e; }
  .verify-card h1{ font-size:1.4rem; margin-bottom:8px; font-family:'Fraunces', serif; }
  .verify-card p.sub{ font-size:.88rem; color:var(--ink-soft,#7a7268); line-height:1.6; margin-bottom:6px; }
  .verify-card p.sub strong{ color:var(--navy-deep,#16324f); }

  .otp-input-row{ display:flex; gap:8px; justify-content:center; margin:24px 0 8px; }
  .otp-input-row input{
    width:46px; height:56px; text-align:center; font-size:1.35rem; font-weight:700;
    border:1.5px solid var(--line,#e4d6bd); border-radius:10px; font-family:'Space Mono', monospace;
    background:var(--paper,#fbf3e7);
  }
  .otp-input-row input:focus{ border-color:var(--marigold,#f2a93b); outline:none; }
  .otp-input-row input.field-invalid{ border-color:var(--brick,#b8442e); }

  .otp-resend{ font-size:.82rem; color:var(--ink-soft,#7a7268); margin:16px 0 4px; }
  .otp-resend button{ background:none; border:none; color:var(--teal-deep,#0f6e56); font-weight:700; cursor:pointer; padding:0; }
  .otp-resend button:disabled{ color:var(--ink-faint,#a89f92); cursor:default; }
  .otp-cooldown{ font-variant-numeric:tabular-nums; font-family:'Space Mono', monospace; }

  .verify-loading{ padding:30px 0; }
  .verify-loading i{ font-size:1.8rem; color:var(--marigold,#f2a93b); }

  .verify-links{ margin-top:22px; font-size:.82rem; }
  .verify-links a, .verify-links button{
    color:var(--ink-soft,#7a7268); background:none; border:none; cursor:pointer;
    font-size:.82rem; text-decoration:underline; padding:0;
  }
  .btn-block{ width:100%; justify-content:center; }
  #verifyError{ margin-top:14px; }
</style>
</head>
<body>

<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="brand">
      <div class="brand-mark"><img src="images/logo.jpg" alt="Six Star Suppliers logo"></div>
      <div>
        <div class="brand-name">Six Star Suppliers</div>
        <div class="brand-tag">Wholesale · Retail · Bulk</div>
      </div>
    </a>
  </div>
</header>

<main class="verify-shell">
  <div class="verify-card">

    <!-- ---------- checking session / auto-sending ---------- -->
    <div id="stageLoading" class="verify-loading">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <!-- ---------- code entry ---------- -->
    <div id="stageCode" style="display:none;">
      <div class="verify-icon"><i class="fa-solid fa-envelope-circle-check"></i></div>
      <h1>Verify your email</h1>
      <p class="sub">Enter the 6-digit code we sent to<br><strong id="verifyEmail"></strong></p>

      <div id="verifyError" class="alert alert-error"></div>

      <form id="verifyForm">
        <div class="otp-input-row" id="otpInputRow">
          <input type="text" inputmode="numeric" maxlength="1" data-otp-digit />
          <input type="text" inputmode="numeric" maxlength="1" data-otp-digit />
          <input type="text" inputmode="numeric" maxlength="1" data-otp-digit />
          <input type="text" inputmode="numeric" maxlength="1" data-otp-digit />
          <input type="text" inputmode="numeric" maxlength="1" data-otp-digit />
          <input type="text" inputmode="numeric" maxlength="1" data-otp-digit />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="verifySubmitBtn" style="margin-top:14px;">
          Verify &amp; continue
        </button>

        <div class="otp-resend">
          Didn't get it? <button type="button" id="resendBtn" disabled>Resend code</button>
          <span id="resendCooldown" class="otp-cooldown"></span>
        </div>
      </form>

      <div class="verify-links">
        <button type="button" id="logoutLink">Use a different account</button>
      </div>
    </div>

    <!-- ---------- couldn't send / generic error ---------- -->
    <div id="stageError" style="display:none;">
      <div class="verify-icon err"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h1>Couldn't send your code</h1>
      <p class="sub" id="errorMsg">Something went wrong. Please try again.</p>
      <button type="button" class="btn btn-primary btn-block" id="retrySendBtn" style="margin-top:16px;">
        Try again
      </button>
      <div class="verify-links">
        <button type="button" id="logoutLinkError">Use a different account</button>
      </div>
    </div>

    <!-- ---------- success ---------- -->
    <div id="stageDone" style="display:none;">
      <div class="verify-icon ok"><i class="fa-solid fa-circle-check"></i></div>
      <h1>You're verified!</h1>
      <p class="sub">Taking you through…</p>
    </div>

  </div>
</main>

<footer class="footer-bottom">© 2026 Six Star Suppliers. All rights reserved.</footer>

<div id="toast"><i class="fa-solid fa-circle-check"></i><span></span></div>

<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  const els = {
    loading: document.getElementById("stageLoading"),
    code: document.getElementById("stageCode"),
    error: document.getElementById("stageError"),
    done: document.getElementById("stageDone"),
    verifyEmail: document.getElementById("verifyEmail"),
    verifyError: document.getElementById("verifyError"),
    verifyForm: document.getElementById("verifyForm"),
    otpInputRow: document.getElementById("otpInputRow"),
    verifySubmitBtn: document.getElementById("verifySubmitBtn"),
    resendBtn: document.getElementById("resendBtn"),
    resendCooldown: document.getElementById("resendCooldown"),
    errorMsg: document.getElementById("errorMsg"),
    retrySendBtn: document.getElementById("retrySendBtn"),
    logoutLink: document.getElementById("logoutLink"),
    logoutLinkError: document.getElementById("logoutLinkError"),
  };

  function hidePageLoader() {
    const loader = document.getElementById("pageLoader");
    if (loader) { loader.classList.add("hide"); loader.style.display = "none"; }
  }

  function showStage(name) {
    ["loading", "code", "error", "done"].forEach((k) => {
      els[k].style.display = k === name ? "block" : "none";
    });
  }

  // Only allow same-site, plain filenames as redirect targets — never trust
  // an arbitrary "next" value as a full URL (open-redirect guard).
  function safeNext(value, fallback) {
    if (typeof value === "string" && /^[a-zA-Z0-9_\-]+\.html$/.test(value)) return value;
    return fallback;
  }

  function roleDefaultPage(role) {
    if (role === "buyer") return "/index.html";
    if (role === "admin") return "/site/admin.html";
    return "/six-star-suppliers/seller-dashboard.html"; // retailer / wholesaler
  }

  const params = new URLSearchParams(location.search);

  let resendCooldownTimer = null;
  let resendCooldownEndsAt = null;

  function startResendCooldown(seconds) {
    resendCooldownEndsAt = Date.now() + seconds * 1000;
    els.resendBtn.disabled = true;
    if (resendCooldownTimer) clearInterval(resendCooldownTimer);

    const tick = () => {
      const remainingMs = resendCooldownEndsAt - Date.now();
      if (remainingMs <= 0) {
        clearInterval(resendCooldownTimer);
        resendCooldownTimer = null;
        els.resendCooldown.textContent = "";
        els.resendBtn.disabled = false;
        return;
      }
      const remaining = Math.ceil(remainingMs / 1000);
      const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
      const ss = String(remaining % 60).padStart(2, "0");
      els.resendCooldown.textContent = `(${mm}:${ss})`;
    };
    tick();
    resendCooldownTimer = setInterval(tick, 250);
  }

  // Pulls a wait-time out of "Please wait 42s before requesting another code"
  // style 429 messages so the cooldown timer on this fresh page load lines
  // up with a code that was actually sent moments ago (e.g. at registration).
  function parseWaitSeconds(message) {
    const match = /(\d+)s/.exec(message || "");
    return match ? Number(match[1]) : 60;
  }

  const digitInputs = Array.from(els.otpInputRow.querySelectorAll("[data-otp-digit]"));
  digitInputs.forEach((input, idx) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      input.classList.remove("field-invalid");
      if (input.value && digitInputs[idx + 1]) digitInputs[idx + 1].focus();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && digitInputs[idx - 1]) digitInputs[idx - 1].focus();
    });
    input.addEventListener("paste", (e) => {
      const text = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
      if (!text) return;
      e.preventDefault();
      text.split("").slice(0, digitInputs.length).forEach((ch, i) => {
        if (digitInputs[i]) digitInputs[i].value = ch;
      });
      const next = digitInputs[Math.min(text.length, digitInputs.length - 1)];
      if (next) next.focus();
    });
  });

  function showVerifyError(msg) {
    els.verifyError.textContent = msg;
    els.verifyError.classList.add("show");
  }
  function clearVerifyError() {
    els.verifyError.classList.remove("show");
  }

  let currentUser = null;

  async function boot() {
    // Needs an active session (set at registration or at login) to call the
    // protected /auth/email/* endpoints. No session at all -> back to login.
    try {
      const res = await SS_API.getMe();
      currentUser = res.user;
    } catch {
      location.href = "login.html";
      return;
    }

    if (currentUser.isVerified) {
      showStage("done");
      hidePageLoader();
      location.href = safeNext(params.get("next"), roleDefaultPage(currentUser.role));
      return;
    }

    els.verifyEmail.textContent = currentUser.email || "your email";
    await attemptSend();
    hidePageLoader();
  }

  async function attemptSend() {
    try {
      const res = await SS_API.sendEmailOtp();
      if (res.alreadyVerified) {
        showStage("done");
        location.href = safeNext(params.get("next"), roleDefaultPage(currentUser.role));
        return;
      }
      showStage("code");
      startResendCooldown(res.expiresInSeconds && res.expiresInSeconds > 60 ? 60 : 60);
      digitInputs[0].focus();
    } catch (err) {
      if (err.status === 429) {
        // A code was already sent very recently (typically right after
        // registration) — don't treat this as a failure, just drop them
        // straight into the entry screen with the cooldown already ticking.
        showStage("code");
        startResendCooldown(parseWaitSeconds(err.message));
        return;
      }
      showStage("error");
      els.errorMsg.textContent = err.message || "Something went wrong. Please try again.";
    }
  }

  els.retrySendBtn.addEventListener("click", async () => {
    showStage("loading");
    await attemptSend();
  });

  els.resendBtn.addEventListener("click", async () => {
    clearVerifyError();
    els.resendBtn.disabled = true;
    try {
      const res = await SS_API.sendEmailOtp();
      if (res.alreadyVerified) {
        showStage("done");
        location.href = safeNext(params.get("next"), roleDefaultPage(currentUser.role));
        return;
      }
      ssToast("Code resent — check your inbox", "fa-paper-plane");
      startResendCooldown(60);
    } catch (err) {
      showVerifyError(err.message || "Couldn't resend the code. Try again shortly.");
      els.resendBtn.disabled = false;
    }
  });

  els.verifyForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = digitInputs.map((i) => i.value).join("");
    if (code.length < 6) {
      digitInputs.forEach((i) => { if (!i.value) i.classList.add("field-invalid"); });
      showVerifyError("Enter all 6 digits.");
      return;
    }
    clearVerifyError();
    els.verifySubmitBtn.disabled = true;
    els.verifySubmitBtn.textContent = "Verifying…";

    try {
      await SS_API.verifyEmailOtp(code);
      if (resendCooldownTimer) clearInterval(resendCooldownTimer);

      // Keep the cached user in sync so other pages don't re-trigger the gate.
      currentUser.isVerified = true;
      if (window.SS_AUTH && typeof SS_AUTH.set === "function") SS_AUTH.set(currentUser);

      showStage("done");
      ssToast("Email verified!", "fa-circle-check");
      setTimeout(() => {
        location.href = safeNext(params.get("next"), roleDefaultPage(currentUser.role));
      }, 500);
    } catch (err) {
      showVerifyError(err.message || "Incorrect code. Please try again.");
      digitInputs.forEach((i) => { i.value = ""; i.classList.add("field-invalid"); });
      digitInputs[0].focus();
      els.verifySubmitBtn.disabled = false;
      els.verifySubmitBtn.textContent = "Verify & continue";
    }
  });

  async function switchAccount() {
    try { await SS_API.logout(); } catch {}
    if (window.SS_AUTH && typeof SS_AUTH.clear === "function") SS_AUTH.clear();
    location.href = "login.html";
  }
  els.logoutLink.addEventListener("click", switchAccount);
  els.logoutLinkError.addEventListener("click", switchAccount);

  boot();
})();
</script>
</body>
</html>
