<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Request | Six Star Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/e1426ab85b.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/rfq.css">
</head>
<body data-page="rfq-detail.html">
<div id="pageLoader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<header class="site-header" id="site-header"></header>

<main class="wrap" style="max-width:1240px;">

  <!-- ===== Request hero ===== -->
  <div class="rfq-detail-hero" id="rfqHero">
    <div class="skel skeleton-card" style="width:100%;height:120px;"></div>
  </div>

  <div class="rfq-layout">
    <!-- ===== LEFT: offers + similar products ===== -->
    <div>
      <div class="rfq-section-title">
        <h2><i class="fa-solid fa-handshake"></i> Offers Received</h2>
        <span class="count-badge" id="offerCountBadge">0</span>
      </div>
      <div class="offer-list" id="offerList">
        <div class="skel skeleton-card" style="width:100%;height:140px;margin-bottom:12px;"></div>
        <div class="skel skeleton-card" style="width:100%;height:140px;"></div>
      </div>

      <div class="rfq-section-title" style="margin-top:34px;">
        <h2><i class="fa-solid fa-sparkles"></i> Similar Products Available Now</h2>
      </div>
      <div class="p-grid similar-products-rail" id="similarProductsGrid"></div>
    </div>

    <!-- ===== RIGHT: chat panel ===== -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-panel__placeholder" id="chatPlaceholder">
        <i class="fa-regular fa-comments"></i>
        <p>Select "Message" on an offer to start a private conversation with that seller.</p>
      </div>
      <!-- filled in dynamically once a conversation is opened -->
    </div>
  </div>

</main>

<!-- ===== Accept-offer confirm ===== -->
<div class="rfq-confirm-overlay" id="acceptOverlay">
  <div class="rfq-confirm-box">
    <i class="fa-solid fa-circle-check"></i>
    <h3>Select this seller?</h3>
    <p>All other pending offers on this request will be automatically declined. You can then arrange final details in your private chat.</p>
    <div class="row">
      <button class="btn btn-outline" id="acceptDismiss">Cancel</button>
      <button class="btn btn-primary" id="acceptConfirm">Yes, select seller</button>
    </div>
  </div>
</div>


<!-- ===== FULLSCREEN CHAT MODAL ===== -->
<div class="rc-modal-overlay" id="rcModalOverlay">
  <div class="rc-modal" id="rcModal">
    <div class="rc-modal__head">
      <div class="rc-head__id">
        <div class="rfq-avatar" id="rcAvatar">?</div>
        <div class="chat-header__info">
          <div class="chat-header__name" id="rcLabel">Seller</div>
          <div class="chat-header__sub" id="rcSub"></div>
        </div>
      </div>
      <button class="rc-modal__close" id="rcModalClose" type="button" aria-label="Close chat">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="chatModerationNotice"></div>
    <div id="chatRestrictedBanner"></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div id="chatImagePreviewBar"></div>
    <div class="chat-input-bar" id="chatInputBar">
      <label class="chat-attach-btn" title="Attach a photo">
        <i class="fa-solid fa-paperclip"></i>
        <input type="file" id="chatImageInput" accept="image/*">
      </label>
      <textarea id="chatTextInput" placeholder="Type a message..." rows="1"></textarea>
      <button class="chat-send-btn" id="chatSendBtn" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>


<footer class="site-footer" id="site-footer"></footer>
<a href="#" class="wa-float" id="wa-float"></a>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/rfq-detail.js"></script>
</body>
</html>
